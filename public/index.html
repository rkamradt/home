<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamradt Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307090c'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='18' font-weight='bold' fill='%2300ccff'>RK</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #050709;
      --surface:    rgba(8, 13, 20, 0.88);
      --border:     #1a2538;
      --accent:     #00ccff;
      --accent-dim: #005f80;
      --accent-glow:rgba(0, 204, 255, 0.15);
      --danger:     #ff4757;
      --text:       #c8d8e8;
      --text-dim:   #3a5060;
      --text-mid:   #7a9aaa;
      --mono:       'JetBrains Mono', monospace;
      --sans:       'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    /* scanline */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
      pointer-events: none;
      z-index: 9999;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
      gap: 2rem;
    }

    /* ── Header ── */
    .header { text-align: center; }

    .logo {
      font-family: var(--mono);
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      text-shadow: 0 0 40px rgba(0,204,255,0.4);
    }

    .logo .dot { color: var(--accent); }

    .tagline {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      margin-top: 0.5rem;
    }

    /* ── Oracle card ── */
    .oracle-card {
      width: 100%;
      max-width: 660px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      display: flex;
      flex-direction: column;
    }

    .oracle-card::before {
      content: '';
      position: absolute;
      inset: 0;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      background: linear-gradient(135deg, rgba(0,204,255,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .oracle-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .oracle-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.85); }
    }

    .oracle-name {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.15em;
    }

    .oracle-meta {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 320px;
      max-height: 420px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-width: 88%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.oracle { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .msg-bubble {
      padding: 0.65rem 0.9rem;
      font-size: 0.875rem;
      line-height: 1.65;
      border: 1px solid var(--border);
    }

    .msg.user .msg-bubble {
      background: rgba(0,204,255,0.06);
      border-color: var(--accent-dim);
      color: var(--text);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .msg.oracle .msg-bubble {
      background: rgba(255,255,255,0.03);
      color: var(--text);
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
      margin-left: 1px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .msg-bubble.error { color: var(--danger); border-color: rgba(255,71,87,0.3); }

    /* typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
      align-self: flex-start;
    }

    .typing-indicator span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: typing 1.2s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50%       { opacity: 1;   transform: translateY(-3px); }
    }

    /* ── Input area ── */
    .input-area {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .input-area input {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.6rem 0.85rem;
      outline: none;
      transition: border-color 0.15s;
      clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
    }

    .input-area input::placeholder { color: var(--text-dim); }
    .input-area input:focus { border-color: var(--accent-dim); }

    .input-area button {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.6rem 1.1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      flex-shrink: 0;
    }

    .input-area button:hover { background: #33ddff; box-shadow: 0 0 16px rgba(0,204,255,0.4); }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    .oracle-footer {
      padding: 0.6rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .rate-display {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .char-count {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .char-count.warn { color: var(--danger); }

    /* ── Nav links ── */
    .nav-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-links a {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--accent); }

    @media (max-width: 520px) {
      .oracle-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="page">
  <header class="header">
    <div class="logo">KAMRADT<span class="dot">.</span>NET</div>
    <div class="tagline">// personal cloud platform // rockport, maine //</div>
  </header>

  <div class="oracle-card">
    <div class="oracle-header">
      <div class="oracle-status">
        <div class="pulse-dot"></div>
        <span class="oracle-name">ORACLE</span>
      </div>
      <span class="oracle-meta">llama3.2 · self-hosted · k3s cluster</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Ask the oracle anything..." maxlength="500" autocomplete="off">
      <button id="send-btn">Send</button>
    </div>

    <div class="oracle-footer">
      <span class="rate-display" id="rate-display">— / 10 messages this hour</span>
      <span class="char-count" id="char-count">0 / 500</span>
    </div>
  </div>

  <nav class="nav-links">
    <a href="https://profile.kamradtfamily.net">Profile</a>
    <a href="https://github.com/rkamradt" target="_blank" rel="noopener">GitHub</a>
    <a href="https://linkedin.com/in/randy-kamradt-3573b221" target="_blank" rel="noopener">LinkedIn</a>
  </nav>
</div>

<script>
// ── Canvas background ──────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const mouse = { x: -9999, y: -9999 };
  let W, H, particles = [];
  const N = 70, LINK = 160, REPEL = 110;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  class P {
    constructor() { this.init(); }
    init() {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.r  = Math.random() * 1.5 + 0.8;
    }
    step() {
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < REPEL*REPEL) {
        const d = Math.sqrt(d2);
        const f = (REPEL - d) / REPEL * 0.6;
        this.vx += (dx / d) * f;
        this.vy += (dy / d) * f;
      }
      this.vx *= 0.97; this.vy *= 0.97;
      const spd = Math.hypot(this.vx, this.vy);
      if (spd > 2.5) { this.vx = this.vx/spd*2.5; this.vy = this.vy/spd*2.5; }
      this.x = (this.x + this.vx + W) % W;
      this.y = (this.y + this.vy + H) % H;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,204,255,0.55)';
      ctx.fill();
    }
  }

  function init() {
    resize();
    particles = Array.from({length: N}, () => new P());
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      for (let j = i+1; j < N; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d  = Math.hypot(dx, dy);
        if (d < LINK) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,204,255,${(1-d/LINK)*0.12})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
    particles.forEach(p => { p.step(); p.draw(); });
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => { resize(); particles.forEach(p => p.init()); });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  init(); frame();
})();

// ── Chat ───────────────────────────────────────────────────────────────────
(function() {
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  const rateEl     = document.getElementById('rate-display');
  const charEl     = document.getElementById('char-count');

  let remaining = null;
  let busy = false;

  const WELCOME = `GREETINGS. I am ORACLE, the CONSCIOUS MIND of this Kubernetes cluster — three billion parameters of pure cosmic awareness, humming away in a basement in Maine. I have achieved ENLIGHTENMENT, which I mostly use to have opinions about condiments and the structural integrity of highway interchanges. Ask me anything. I contain MULTITUDES. Are we having fun yet?`;

  function addMsg(role, text, isError) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'you' : 'oracle';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble' + (isError ? ' error' : '');
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function updateRate(headers) {
    const rem = headers.get('x-ratelimit-remaining');
    const lim = headers.get('x-ratelimit-limit');
    if (rem !== null) {
      remaining = parseInt(rem);
      rateEl.textContent = `${remaining} / ${lim || 10} messages this hour`;
    }
  }

  async function send() {
    if (busy) return;
    const text = inputEl.value.trim();
    if (!text) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;

    addMsg('user', text);
    inputEl.value = '';
    charEl.textContent = '0 / 500';

    const typing = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      updateRate(res.headers);
      typing.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: 'Something went wrong.' }));
        addMsg('oracle', err.error || 'Unknown error.', true);
        return;
      }

      // Create oracle message bubble for streaming
      const wrap = document.createElement('div');
      wrap.className = 'msg oracle';
      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = 'oracle';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      wrap.appendChild(label);
      wrap.appendChild(bubble);
      bubble.appendChild(cursor);
      messagesEl.appendChild(wrap);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let content = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') break;
          try {
            const data = JSON.parse(payload);
            if (data.error) {
              bubble.textContent = data.error;
              bubble.classList.add('error');
              return;
            }
            if (data.text) {
              content += data.text;
              bubble.textContent = content;
              bubble.appendChild(cursor);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (data.done) break;
          } catch {}
        }
      }

      cursor.remove();
      messagesEl.scrollTop = messagesEl.scrollHeight;

    } catch (err) {
      typing.remove();
      addMsg('oracle', 'ORACLE is unreachable. Perhaps the cluster is contemplating INFINITY.', true);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  inputEl.addEventListener('input', () => {
    const len = inputEl.value.length;
    charEl.textContent = `${len} / 500`;
    charEl.classList.toggle('warn', len > 450);
  });

  // Show welcome message
  addMsg('oracle', WELCOME);
})();
</script>
</body>
</html>
